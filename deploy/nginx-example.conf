# Example reverse proxy for the public scorecard site (the `web` container, port 8027).
# Only the scorecard site goes here. Never proxy the private Outrider page (port 8026).
#
# The site is read-only and every page is precomputed, so a short cache plus a
# per-address rate limit is enough to keep load predictable.

limit_req_zone $binary_remote_addr zone=eddnv:10m rate=5r/s;
proxy_cache_path /var/cache/nginx/eddnv levels=1:2 keys_zone=eddnv_cache:10m max_size=200m
                 inactive=30m use_temp_path=off;

server {
    listen 443 ssl http2;
    server_name eddn-validator.example.org;           # your name here

    ssl_certificate     /etc/letsencrypt/live/eddn-validator.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eddn-validator.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Only these paths exist; everything else is refused before reaching the app.
    location ~ ^/(|about|health|card/[0-9]+/(1|7|14|30|90|180))$ {
        limit_except GET HEAD { deny all; }
        limit_req zone=eddnv burst=20 nodelay;
        limit_req_status 429;

        proxy_cache eddnv_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_use_stale error timeout updating;

        proxy_pass http://127.0.0.1:8027;       # the web container's host and WEB_PORT
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
        client_max_body_size 1k;
    }

    location / { return 404; }
}

server {
    listen 80;
    server_name eddn-validator.example.org;
    return 301 https://$host$request_uri;
}
